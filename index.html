<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOCUS · Academic Dashboard</title>
<meta name="theme-color" content="#0c1424">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f3f5fa; --panel:#ffffff; --panel2:#f7f9fc; --text:#0f172a; --muted:#64748b; --line:#e3e8f1;
  --accent:#2563eb; --accent-ink:#ffffff; --accent-soft:color-mix(in srgb,var(--accent) 12%,transparent);
  --ok:#15803d; --ok-soft:#dcfce7; --warn:#b45309; --warn-soft:#fef3c7; --bad:#b91c1c; --bad-soft:#fee2e2;
  --side:#0c1424; --side-2:#121c31; --side-text:#b8c3d6; --side-muted:#6f7d96;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 6px 20px rgba(15,23,42,.06);
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
[data-theme="dark"]{
  --bg:#0a0f1c; --panel:#111a2c; --panel2:#0d1526; --text:#e6eaf2; --muted:#8e9bb3; --line:#1e2a42;
  --accent-soft:color-mix(in srgb,var(--accent) 20%,transparent);
  --ok:#4ade80; --ok-soft:rgba(74,222,128,.12); --warn:#fbbf24; --warn-soft:rgba(251,191,36,.12); --bad:#f87171; --bad-soft:rgba(248,113,113,.12);
  --side:#060a14; --side-2:#0d1424;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:15px;height:15px}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:268px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-text);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;color:#fff;font-weight:700;letter-spacing:.08em;font-size:15px}
.brand .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 50%,#a855f7));display:grid;place-items:center}
.brand small{display:block;font-weight:500;letter-spacing:0;color:var(--side-muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:var(--side-text);padding:9px 11px;border-radius:10px;cursor:pointer;text-align:left;font-weight:500}
.nav-item:hover{background:var(--side-2);color:#fff}
.nav-item.active{background:var(--side-2);color:#fff}
.nav-item .chev{margin-left:auto;transition:transform .2s;opacity:.6}
.nav-group.open .chev{transform:rotate(90deg)}
.subnav{display:none;flex-direction:column;margin:2px 0 6px 20px;padding-left:12px;border-left:1px solid #1f2a40}
.nav-group.open .subnav{display:flex}
.sub-item{border:0;background:none;color:var(--side-muted);text-align:left;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.sub-item:hover{color:#fff}
.sub-item.active{color:#fff;background:color-mix(in srgb,var(--accent) 28%,transparent)}
.side-foot{margin-top:auto;padding:14px 10px 4px;border-top:1px solid #1a2438;font-size:12px;color:var(--side-muted)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:20px 32px 6px}
.topbar h1{font-size:22px;letter-spacing:-.01em}
.crumb{color:var(--muted);font-size:13px}
.menu-btn{display:none}
.content{padding:14px 32px 48px;max-width:1280px;width:100%}

/* ---------- primitives ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card + .card{margin-top:16px}
.grid > .card,.grid > .card + .card{margin-top:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h2{font-size:16px;font-weight:650}
.card-h .sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);padding:8px 13px;border-radius:10px;cursor:pointer;font-weight:550;font-size:14px;white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--panel2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
.icon-btn{border:0;background:none;padding:6px;border-radius:8px;cursor:pointer;color:var(--muted);display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--panel2);color:var(--text)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px 11px;outline:none}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{resize:vertical;min-height:70px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:550}
label.f > span{padding-left:2px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;font-size:14px}
.divider{height:1px;background:var(--line);margin:14px 0}
.progress{height:8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.progress > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.kbd{font-family:var(--mono);font-size:12px;background:var(--panel2);border:1px solid var(--line);padding:1px 6px;border-radius:6px}
.notice{padding:12px 14px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);font-size:13.5px}
.notice.warn{background:var(--warn-soft);border-color:transparent}
.notice.ok{background:var(--ok-soft);border-color:transparent}
.notice.bad{background:var(--bad-soft);border-color:transparent}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
.hidden{display:none !important}

/* ---------- home ---------- */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.hero h2{font-size:28px;letter-spacing:-.02em}
.hero p{color:var(--muted)}
.stat{padding:16px 18px}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.stat .s{font-size:13px;color:var(--muted)}
.agenda-item{display:grid;grid-template-columns:86px 4px 1fr;gap:12px;padding:9px 0;align-items:start}
.agenda-item + .agenda-item{border-top:1px solid var(--line)}
.agenda-item .t{font-size:13px;color:var(--muted);font-weight:600;padding-top:1px}
.agenda-item .bar{width:4px;border-radius:4px;height:100%;min-height:22px}
.agenda-item .ti{font-weight:600}
.agenda-item .meta{font-size:12.5px;color:var(--muted)}
.day-h{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 4px}
.day-h:first-child{margin-top:0}

/* ---------- plan ---------- */
.sem{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
.sem + .sem{margin-top:14px}
.sem-h{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--panel2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.sem-h .name{font-weight:700;font-size:15.5px;border:1px solid transparent;background:none;padding:3px 6px;border-radius:7px;min-width:120px}
.sem-h .name:hover,.sem-h .name:focus{border-color:var(--line);background:var(--panel);outline:none}
.sem-h .sp{flex:1}
.sem-gpa{font-weight:700}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-weight:650}
table.t td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr:hover td{background:color-mix(in srgb,var(--panel2) 60%,transparent)}
.cell{width:100%;border:1px solid transparent;background:none;padding:5px 7px;border-radius:7px;outline:none}
.cell:hover{border-color:var(--line)}
.cell:focus{border-color:var(--accent);background:var(--panel2)}
select.cell{appearance:auto;cursor:pointer}
.code{font-weight:650}
td.c-apply{width:54px;text-align:center}
td.c-cr{width:84px}
td.c-gr{width:96px}
td.c-act{width:118px;text-align:right;white-space:nowrap}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.sem-foot{display:flex;gap:10px;padding:10px 16px;border-top:1px solid var(--line);align-items:center}
.status-completed{color:var(--ok)}
.gpa-big{font-size:44px;font-weight:750;letter-spacing:-.03em;line-height:1}

/* ---------- drawer & modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(5,10,20,.45);backdrop-filter:blur(2px);z-index:50;display:flex;justify-content:flex-end}
.overlay.center{justify-content:center;align-items:center;padding:20px}
.drawer{width:min(620px,100%);height:100%;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;animation:slide .18s ease}
@keyframes slide{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
.drawer-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer-h h3{font-size:19px}
.drawer-b{padding:18px 22px;overflow-y:auto;flex:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px -22px 16px;padding:0 22px}
.tab{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--text);border-color:var(--accent)}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(560px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .15s ease}
.modal.wide{width:min(980px,100%);height:88vh;display:flex;flex-direction:column}
@keyframes pop{from{transform:scale(.97);opacity:.5}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:16.5px;flex:1}
.modal-b{padding:18px 20px}
.modal.wide .modal-b{flex:1;padding:0}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
.viewer{width:100%;height:100%;border:0;background:#fff}
.oh-row{display:grid;grid-template-columns:1.3fr 1fr 1fr 1.4fr auto;gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:11px;background:var(--panel2)}
.oh-row + .oh-row{margin-top:8px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days label{cursor:pointer}
.days input{display:none}
.days span{display:inline-block;padding:4px 7px;border-radius:7px;border:1px solid var(--line);font-size:12px;font-weight:650;color:var(--muted);background:var(--panel)}
.days input:checked + span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* ---------- calendar ---------- */
.cal-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cal-top h2{font-size:20px;min-width:200px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--panel2)}
.seg button{border:0;background:none;padding:5px 11px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.active{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--line);gap:1px}
.month .dow{background:var(--panel2);padding:8px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center}
.mday{background:var(--panel);min-height:112px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.mday:hover{background:var(--panel2)}
.mday.out{background:var(--panel2)}
.mday.out .dn{opacity:.45}
.mday .dn{font-size:12.5px;font-weight:650;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.mday.today .dn{background:var(--accent);color:var(--accent-ink)}
.ev{font-size:11.5px;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:550;border-left:3px solid currentColor}
.more{font-size:11.5px;color:var(--muted);padding-left:4px;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.gframe{width:100%;height:720px;border:1px solid var(--line);border-radius:var(--radius);background:#fff}

/* ---------- resume ---------- */
.res-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.avatar{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--accent),#7c3aed);display:grid;place-items:center;color:#fff;font-weight:750;font-size:22px;flex:none}
.res-sec + .res-sec{margin-top:18px}
.res-sec h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:8px}
.entry{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.entry + .entry{margin-top:8px}
.entry .eh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.entry .org{font-weight:650}
.entry ul{margin:6px 0 0 18px}
.entry li{margin:3px 0;font-size:14px}
.slot-tabs{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- grad ---------- */
.school{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--panel)}
.school + .school{margin-top:8px}
.school:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.school.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rank{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:750;font-size:13px;flex:none}
.req{display:flex;align-items:center;gap:10px;padding:7px 4px}
.req + .req{border-top:1px solid var(--line)}
.req input.cell{flex:1}
.req.done input.cell{text-decoration:line-through;color:var(--muted)}

/* ---------- misc ---------- */
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{background:var(--text);color:var(--panel);padding:11px 15px;border-radius:11px;font-size:14px;box-shadow:var(--shadow);max-width:380px;animation:pop .15s ease}
.toast.error{background:var(--bad);color:#fff}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:10px;border:2px solid transparent;cursor:pointer}
.sw.active{border-color:var(--text);box-shadow:0 0 0 3px var(--panel) inset}
.theme-opt{border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;background:var(--panel2);text-align:left}
.theme-opt.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.theme-prev{height:62px;border-radius:9px;margin-bottom:10px;border:1px solid var(--line)}
.age-num{font-size:52px;font-weight:750;letter-spacing:-.03em;line-height:1}
.note{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);border-left:4px solid var(--accent)}

@media (max-width:1050px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:60;transform:translateX(-100%);transition:transform .2s}
  body.nav-open .side{transform:none}
  body.nav-open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
  .menu-btn{display:inline-grid}
  .topbar,.content{padding-left:16px;padding-right:16px}
  .g2,.g3,.g4,.grid{grid-template-columns:1fr !important}
  .sem .tw table{min-width:560px}
  .oh-row{grid-template-columns:1fr 1fr}
  .mday{min-height:70px}
  .ev{font-size:10px}
  table.t .hide-sm{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" data-act="toggleNav" aria-label="Menu"></button>
      <div><div class="crumb" id="crumb"></div><h1 id="pageTitle"></h1></div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div id="layer"></div>
<div class="toasts" id="toasts"></div>
<input type="file" id="filePick" class="hidden">

}

  const proj = s.status !== "completed" && s.courses.some(c => !c.grade && c.expected) ? gpaOf(s.courses, true) : null;
  return `<section class="sem" data-sem="${s.id}">
    <div class="sem-h">
      <input class="name" value="${esc(s.name)}" data-act="semName" data-sem="${s.id}" aria-label="Semester name">
      <select class="cell" style="width:auto" data-act="semStatus" data-sem="${s.id}">${["planned", "in-progress", "completed"].map(x => `<option value="${x}" ${s.status === x ? "selected" : ""}>${x === "in-progress" ? "In progress" : x[0].toUpperCase() + x.slice(1)}</option>`).join("")}</select>
      <div class="sp"></div>
      ${warns.length ? `<span class="chip warn" title="${esc(warns.join("\n"))}">${warns.length} warning${warns.length > 1 ? "s" : ""}</span>` : ""}
      <span class="small muted">${cr} credits</span>${proj ? `<span class="chip" title="Using expected grades">Projected ${fmtGpa(proj.gpa)}</span>` : ""}<span class="chip ${g.gpa == null ? "" : "acc"}">Term GPA <b class="sem-gpa">&nbsp;${fmtGpa(g.gpa)}</b></span>
      <button class="icon-btn" title="Move up" data-act="semMove" data-sem="${s.id}" data-d="-1" ${si === 0 ? "disabled" : ""} style="transform:rotate(-90deg)">${ic("chev", "sm")}</button>
      <button class="icon-btn" title="Delete semester" data-act="semDel" data-sem="${s.id}">${ic("trash", "sm")}</button>
    </div>
    <div class="tw"><table class="t"><thead><tr><th style="text-align:center">Apply</th><th>Course</th><th class="hide-sm">Title</th><th>Credits</th><th>Grade</th><th>Expected</th><th></th></tr></thead><tbody>
    ${s.courses.map(c => { const rep = sup.get(c.id); const R = `data-sem="${s.id}" data-id="${c.id}"`; return `<tr${rep ? ' style="opacity:.62"' : ""}>
      <td class="c-apply"><input type="checkbox" ${c.apply ? "checked" : ""} data-act="cField" data-f="apply" ${R} title="Count in GPA"></td>
      <td style="width:190px;white-space:nowrap"><input class="cell code" style="width:${c.transfer || rep ? 112 : 150}px" value="${esc(c.code)}" placeholder="Code" data-act="cField" data-f="code" ${R}>${c.transfer ? `<span class="chip" style="margin-left:4px" title="Transfer credit (not in UK GPA unless you tick Apply)">T</span>` : ""}${rep ? `<span class="chip" style="margin-left:4px" title="Replaced by the repeat grade">Repeated</span>` : ""}</td>
      <td class="hide-sm"><input class="cell" value="${esc(c.title)}" placeholder="Title" data-act="cField" data-f="title" ${R}></td>
      <td class="c-cr"><select class="cell" data-act="cField" data-f="credits" ${R}>${[0, 1, 2, 3, 4, 5, 6].map(n => `<option ${+c.credits === n ? "selected" : ""}>${n}</option>`).join("")}</select></td>
      <td class="c-gr"><select class="cell" data-act="cField" data-f="grade" ${R}>${GRADES.map(gr => `<option value="${gr}" ${c.grade === gr ? "selected" : ""}>${gr || "—"}</option>`).join("")}</select></td>
      <td class="c-gr">${c.grade ? `<span class="muted small" style="padding-left:8px">—</span>` : `<select class="cell" style="color:var(--muted)" data-act="cField" data-f="expected" ${R}>${EXPECTED.map(gr => `<option value="${gr}" ${c.expected === gr ? "selected" : ""}>${gr || "—"}</option>`).join("")}</select>`}</td>
      <td class="c-act">
        <button class="icon-btn" title="${c.syllabus ? "Syllabus uploaded" : "Syllabus, office hours, dates"}" data-act="openCourse" ${R}>${ic(c.syllabus ? "file" : "clock", "sm")}</button>
        <button class="btn sm ghost" data-act="openCourse" ${R}>Details</button>
        <button class="icon-btn" title="Remove course" data-act="cDel" ${R}>${ic("x", "sm")}</button></td></tr>`; }).join("") || `<tr><td colspan="7"><div class="empty" style="margin:8px 0">No courses yet.</div></td></tr>`}
    </tbody></table></div>
    ${warns.length ? `<div style="padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap">${warns.map(w => `<span class="chip warn">${esc(w)}</span>`).join("")}</div>` : ""}
    <div class="sem-foot"><button class="btn sm" data-act="cAdd" data-sem="${s.id}">${ic("plus", "sm")}Add course</button>
      ${s.courses.some(c => c.notes) ? `<span class="tiny muted">${s.courses.filter(c => c.notes).map(c => `<b>${esc(c.code)}:</b> ${esc(c.notes)}`).join(" · ")}</span>` : ""}</div>
  </section>`;
}

function resumeEditor(p) {
  const I = (path, v, ph = "", st = "") => `<input class="input" value="${esc(v)}" placeholder="${ph}" data-act="rEdit" data-path="${path}" style="${st}">`;
  return `<div class="card"><div class="notice" style="margin-bottom:14px">Fix anything FOCUS read wrong. Changes save as you type. Uploading a new version replaces this with a fresh read.</div>
    <div class="grid g2">${I("name", p.name, "Name")}${I("contacts", p.contacts.join(" • "), "Contacts, separated by •")}</div>
    ${p.sections.map((sec, si) => `<div class="res-sec" style="margin-top:18px"><div class="row" style="flex-wrap:nowrap">${I(`s.${si}.title`, sec.title, "Section", "font-weight:700;max-width:260px")}<div style="flex:1"></div><button class="btn sm ghost" data-act="rEntryAdd" data-si="${si}">${ic("plus", "sm")}Entry</button><button class="icon-btn" title="Delete section" data-act="rSecDel" data-si="${si}">${ic("trash", "sm")}</button></div>
      ${sec.entries.map((e, ei) => `<div class="entry" style="margin-top:8px"><div class="grid g2" style="gap:8px">${I(`s.${si}.${ei}.org`, e.org, "Organization / school")}${I(`s.${si}.${ei}.location`, e.location, "Location")}${I(`s.${si}.${ei}.role`, e.role, "Role / degree")}${I(`s.${si}.${ei}.date`, e.date, "Dates")}</div>
        <textarea class="input" style="margin-top:8px" rows="${Math.max(2, e.bullets.length + 1)}" placeholder="One bullet per line" data-act="rEdit" data-path="s.${si}.${ei}.bullets">${esc(e.bullets.join("\n"))}</textarea>
        <div class="row" style="justify-content:flex-end;margin-top:6px"><button class="btn sm ghost danger" data-act="rEntryDel" data-si="${si}" data-ei="${ei}">${ic("trash", "sm")}Remove entry</button></div></div>`).join("")}</div>`).join("")}
    <div class="row" style="margin-top:14px"><button class="btn" data-act="rSecAdd">${ic("plus")}Add section</button></div>
    <label class="f" style="margin-top:14px"><span>Skills (comma separated)</span><textarea class="input" rows="2" data-act="rEdit" data-path="skills">${esc(p.skills.join(", "))}</textarea></label></div>`;
}
function keyPoints(p) {
  const get = re => p.sections.find(s => re.test(s.title));
  const edu = get(/educat/i), exp = get(/experience|employment|work|military|service/i), aff = get(/affiliat|activit|leadership|involve|project|research/i);
  const pts = [];
  if (edu?.entries[0]) { const e = edu.entries[0]; pts.push(`<b>${esc(e.org)}</b>${e.role ? " · " + esc(e.role.replace(/^Major:\s*/i, "")) : ""}${e.date ? ` <span class="muted">(${esc(e.date)})</span>` : ""}${e.details.length ? "<br><span class='muted small'>" + e.details.map(esc).join("; ") + "</span>" : ""}`); }
  for (const e of (exp?.entries || []).slice(0, 4)) pts.push(`<b>${esc(e.org.split(",")[0])}</b>${e.org.includes(",") ? " · " + esc(e.org.split(",").slice(1).join(",").trim()) : e.role ? " · " + esc(e.role) : ""}${e.date ? ` <span class="muted">(${esc(e.date)})</span>` : ""}${e.bullets[0] ? `<br><span class="small">${esc(e.bullets[0])}</span>` : ""}`);
  for (const e of (aff?.entries || []).slice(0, 4)) pts.push(`<b>${esc(e.org)}</b>${e.role ? " · " + esc(e.role) : ""}${e.date ? ` <span class="muted">(${esc(e.date)})</span>` : ""}`);
  return pts.length ? `<div class="stack" style="gap:10px">${pts.map(x => `<div class="small" style="padding-left:10px;border-left:3px solid var(--accent)">${x}</div>`).join("")}</div>` : `<div class="empty">Couldn't find clear sections. Try a text-based PDF (not a scan).</div>`;
}

/* ---------- Tools: Age ---------- */
VIEWS["tools/age"] = () => {
  const b = S.profile.birthdate; let out = "";
  if (b) {
    const bd = parseYmd(b), now = startOfDay(new Date());
    if (bd > now) out = `<div class="notice warn">That date is in the future.</div>`;
    else {
      let y = now.getFullYear() - bd.getFullYear(), m = now.getMonth() - bd.getMonth(), d = now.getDate() - bd.getDate();
      if (d < 0) { m--; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); } if (m < 0) { y--; m += 12; }
      let next = new Date(now.getFullYear(), bd.getMonth(), bd.getDate()); if (next < now) next = new Date(now.getFullYear() + 1, bd.getMonth(), bd.getDate());
      const toNext = Math.round((next - now) / 864e5), days = Math.round((now - bd) / 864e5);
      out = `<div class="grid g3" style="margin-top:16px">
        <div class="card"><div class="small muted">Age</div><div class="age-num">${y}</div><div class="muted">${m} months, ${d} days</div></div>
        <div class="card"><div class="small muted">Next birthday</div><div class="age-num">${toNext === 0 ? "🎉" : toNext}</div><div class="muted">${toNext === 0 ? "Happy birthday!" : `days · ${fmtDate(next, {weekday: "long", month: "long", day: "numeric"})} (turning ${y + 1})`}</div></div>
        <div class="card"><div class="small muted">Days alive</div><div class="age-num">${days.toLocaleString()}</div><div class="muted">Born on a ${fmtDate(bd, {weekday: "long"})}</div></div></div>`;
    }
  }
  return `<div class="card" style="max-width:520px"><div class="card-h">${ic("cake")}<h2>Age calculator</h2></div>
    <label class="f"><span>Date of birth</span><input class="input" type="date" value="${esc(b)}" data-act="birth"></label>
    <div class="tiny muted" style="margin-top:6px">Saved only in this browser.</div></div>${out}`;
};

async function viewFile(fid, name) {
  let rec; try { rec = await Cloud.getFile(fid); } catch (e) { return toast(e.message, "error"); }
  if (!rec) return toast("That file isn't on this device. Connect Google to fetch it, or re-upload it here.", "error");
  const url = URL.createObjectURL(rec.blob); const type = rec.type || guessType(rec.name);
  let inner;
  if (/pdf/.test(type)) inner = `<iframe class="viewer" src="${url}" data-blob="${url}"></iframe>`;
  else if (/image/.test(type)) inner = `<div style="overflow:auto;height:100%;display:grid;place-items:center;background:var(--panel2)"><img src="${url}" style="max-width:100%"></div>`;
  else if (/text/.test(type)) inner = `<pre style="padding:20px;white-space:pre-wrap;overflow:auto;height:100%">${esc(await rec.blob.text())}</pre>`;
  else inner = `<div class="empty" style="margin:30px">This file type can't be previewed here.</div>`;
  modal(esc(name || rec.name), inner, `<a class="btn" href="${url}" target="_blank" rel="noopener">${ic("eye", "sm")}Open in new tab</a><a class="btn primary" href="${url}" download="${esc(rec.name)}">${ic("download", "sm")}Download</a>`, true);
}

function parseCSV(t) { const rows = []; let row = [], f = "", q = false; for (let i = 0; i < t.length; i++) { const ch = t[i]; if (q) { if (ch === '"' && t[i + 1] === '"') { f += '"'; i++; } else if (ch === '"') q = false; else f += ch; } else if (ch === '"') q = true; else if (ch === ",") { row.push(f); f = ""; } else if (ch === "\n" || ch === "\r") { if (ch === "\r" && t[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; } else f += ch; } if (f || row.length) { row.push(f); rows.push(row); } return rows.filter(r => r.some(x => x.trim())); }

  rlExport: () => download(`research-log-${ymd(new Date())}.md`, `# Research log: ${S.profile.fullName}\n\n` + S.research.entries.map(e => `## ${e.term}${e.lab ? " · " + e.lab : ""}${e.mentor ? " (mentor: " + e.mentor + ")" : ""}\n\n- **Question:** ${e.question}\n- **Method:** ${e.method}\n- **Result:** ${e.result}\n- **Next step:** ${e.next}\n- **Outputs:** ${e.outputs}\n- **Hours/week:** ${e.hours}\n`).join("\n") + `\n## Milestones\n\n` + S.research.milestones.map(m => `- [${m.done ? "x" : " "}] ${m.term}: ${m.text}`).join("\n"), "text/markdown"),
  pickIcs: () => pick(".ics,text/calendar", handleIcsFile),
  agendaDays: a => { S.ui.agendaDays = +a.dataset.n; save(); rerender(); },
  /* resume */
  resSel: a => { S.ui.resumeSel = a.dataset.id; save(); rerender(); },
  resUpload: a => { const id = a.dataset.id; pick(".pdf,.txt", f => handleResume(id, f)); },
  resView: a => { const r = S.resumes.find(x => x.id === a.dataset.id); viewFile(r.current.fileId, r.current.fileName); },
  resAddSlot: () => { const l = prompt("Name this resume version (e.g. ETSC, Research, Internship):"); if (!l) return; const r = {id: uid(), label: l.trim(), current: null, history: []}; S.resumes.push(r); S.ui.resumeSel = r.id; save(); rerender(); },
  resRename: a => { const r = S.resumes.find(x => x.id === a.dataset.id), l = prompt("Rename resume version:", r.label); if (l) { r.label = l.trim(); save(); rerender(); } },
  resDelSlot: a => { const r = S.resumes.find(x => x.id === a.dataset.id); if (!confirm(`Remove the ${r.label} resume?`)) return; if (r.current) delFile(r.current.fileId); S.resumes = S.resumes.filter(x => x !== r); if (!S.resumes.length) S.resumes.push({id: uid(), label: "General", current: null, history: []}); S.ui.resumeSel = null; save(); rerender(); },
  /* grad */
  gSel: a => { S.ui.gradSel = a.dataset.id; save(); rerender(); },
  gAdd: () => { const g = {id: uid(), rank: S.gradSchools.length + 1, name: "New school", location: "", program: "PhD", status: "Researching", deadline: "", fee: "", minGpa: "", gre: "", english: "", website: "", faculty: "", info: "", notes: "", requirements: SEED.requirements.map(t => ({id: uid(), text: t, done: false})), files: []}; S.gradSchools.push(g); S.ui.gradSel = g.id; save(); rerender(); setTimeout(() => $('[data-act="gField"][data-k="name"]')?.select(), 30); },
  gDel: a => { const g = S.gradSchools.find(x => x.id === a.dataset.id); if (!confirm(`Delete ${g.name}?`)) return; g.files.forEach(f => delFile(f.fileId)); S.gradSchools = S.gradSchools.filter(x => x !== g); S.ui.gradSel = null; save(); rerender(); },
  reqAdd: () => { curGrad().requirements.push({id: uid(), text: "", done: false}); save(); rerender(); setTimeout(() => $$('[data-act="reqText"]').pop()?.focus(), 30); },
  reqDel: a => { const g = curGrad(); g.requirements = g.requirements.filter(r => r.id !== a.dataset.id); save(); rerender(); },
  gFile: () => pick("*/*", async f => { const g = curGrad(); g.files.push({fileId: await saveFile(f), name: f.name}); save(); rerender(); toast("File attached."); }),
  gFileDel: a => { const g = curGrad(); delFile(a.dataset.fid); g.files = g.files.filter(f => f.fileId !== a.dataset.fid); save(); rerender(); },
  gExport: () => download("grad-schools.json", JSON.stringify(S.gradSchools.map(({files, id, ...g}) => g), null, 2)),
  gImport: () => pick(".json,.csv,text/csv,application/json", async f => {
    try {
      const t = await f.text(); let rows;
      if (/\.json$/i.test(f.name) || /^\s*[\[{]/.test(t)) { const j = JSON.parse(t); rows = Array.isArray(j) ? j : j.gradSchools || [j]; }
      else { const [h, ...r] = parseCSV(t); const keys = h.map(x => x.trim().toLowerCase().replace(/[^a-z]/g, "")); const map = {school: "name", university: "name", name: "name", program: "program", location: "location", deadline: "deadline", fee: "fee", applicationfee: "fee", gre: "gre", gpa: "minGpa", mingpa: "minGpa", website: "website", url: "website", rank: "rank", notes: "notes", info: "info", requirements: "requirements", faculty: "faculty", english: "english", status: "status"};
        rows = r.map(v => Object.fromEntries(keys.map((k, i) => [map[k] || k, (v[i] || "").trim()]))); }
      let added = 0, updated = 0;
      for (const x of rows) { if (!x.name) continue;
        let reqs = x.requirements; if (typeof reqs === "string") reqs = reqs.split(/;|\n/).map(s => s.trim()).filter(Boolean);
        reqs = (reqs || []).map(r => typeof r === "string" ? {id: uid(), text: r, done: false} : {id: uid(), text: r.text || "", done: !!r.done});
        const ex = S.gradSchools.find(g => g.name.toLowerCase() === String(x.name).toLowerCase());
        const clean = Object.fromEntries(Object.entries(x).filter(([k, v]) => v !== "" && k !== "requirements" && k !== "id" && k !== "files"));
        if (clean.deadline && !/^\d{4}-\d{2}-\d{2}$/.test(clean.deadline)) { const d = new Date(clean.deadline); clean.deadline = isNaN(d) ? "" : ymd(d); }
        if (ex) { Object.assign(ex, clean); if (reqs.length) ex.requirements = reqs; updated++; }
        else { S.gradSchools.push({id: uid(), rank: S.gradSchools.length + 1, location: "", program: "PhD", status: "Researching", deadline: "", fee: "", minGpa: "", gre: "", english: "", website: "", faculty: "", info: "", notes: "", ...clean, requirements: reqs.length ? reqs : SEED.requirements.map(t => ({id: uid(), text: t, done: false})), files: []}); added++; }
      }
      save(); rerender(); toast(`Imported: ${added} new, ${updated} updated.`);
    } catch (e) { toast("Couldn't read that file: " + e.message, "error"); }
  }),
  /* settings */
  theme: a => { S.settings.theme = a.dataset.v; save(); applyTheme(); rerender(); },
  accent: a => { S.settings.accent = a.dataset.v; save(); applyTheme(); rerender(); },
  exportAll: () => download(`focus-backup-${ymd(new Date())}.json`, JSON.stringify({...S, ui: {}}, null, 2)),
  importAll: () => pick(".json,application/json", async f => { try { const j = JSON.parse(await f.text()); if (!j.semesters || !j.settings) throw new Error("Not a FOCUS backup."); S = migrate(j); save(); applyTheme(); rerender(); toast("Backup restored."); } catch (e) { toast(e.message, "error"); } }),
  resetAll: () => { if (!confirm("Reset everything to the original plan? This clears your edits.")) return; const keep = {clientId: S.settings.clientId, gcalIds: S.settings.gcalIds}; S = seedState(); Object.assign(S.settings, keep); save(); applyTheme(); rerender(); toast("FOCUS reset."); }
};
const CHANGE = {
  cField: a => { const s = sem(a.dataset.sem), c = s.courses.find(x => x.id === a.dataset.id), f = a.dataset.f;
    c[f] = f === "apply" ? a.checked : f === "credits" ? +a.value : a.value; save(); rerender(); },
  semName: a => { sem(a.dataset.sem).name = a.value.trim() || "Semester"; save(); rerender(); },
  semStatus: a => { sem(a.dataset.sem).status = a.value; save(); rerender(); },
  courseSem: a => { S.ui.courseSem = a.value; save(); rerender(); },
  targetGpa: a => { S.ui.targetGpa = a.value; save(); rerender(); },
  dField: a => { const c = dCourse(), k = a.dataset.k; c[k] = k === "apply" ? a.checked : k === "credits" ? +a.value : a.value; save(); rerender(); if (["code", "title"].includes(k)) openCourse(drawerState.sid, drawerState.cid); },
  ohDay: a => { const o = dCourse().officeHours.find(x => x.id === a.dataset.oh), d = +a.dataset.d; o.days = a.checked ? [...new Set([...(o.days || []), d])].sort() : o.days.filter(x => x !== d); save(); rerender(); },
  ohField: a => { const o = dCourse().officeHours.find(x => x.id === a.dataset.oh); o[a.dataset.k] = a.value; save(); rerender(); },
  kdField: a => { const k = dCourse().keyDates.find(x => x.id === a.dataset.kd); k[a.dataset.k] = a.value; save(); rerender(); },
  setFlag: a => { S.settings[a.dataset.k] = a.checked; save(); },
  gField: a => { const g = curGrad(), k = a.dataset.k; g[k] = k === "rank" ? (a.value ? +a.value : "") : a.value; save(); rerender(); },
  reqDone: a => { curGrad().requirements.find(r => r.id === a.dataset.id).done = a.checked; save(); rerender(); },
  reqText: a => { curGrad().requirements.find(r => r.id === a.dataset.id).text = a.value; save(); },
  birth: a => { S.profile.birthdate = a.value; save(); rerender(); },
  pField: a => { S.profile[a.dataset.k] = a.value; save(); rerender(); },
  setFlagR: a => { S.settings[a.dataset.k] = a.checked; save(); rerender(); },
  setNum: a => { S.settings[a.dataset.k] = +a.value || 0; save(); rerender(); },
  setText: a => { S.settings[a.dataset.k] = a.value.trim(); save(); rerender(); },
  prereqs: a => { S.prereqs = a.value; save(); rerender(); },
  calPick: a => { const id = a.dataset.primary === "1" ? "primary" : a.dataset.id; const set = new Set(S.settings.gcalIds || []); a.checked ? set.add(id) : set.delete(id); S.settings.gcalIds = [...set]; save(); gcalRefresh(true).catch(e => toast(e.message, "error")); },
  notifyToggle: async a => { if (a.checked) { if (typeof Notification === "undefined") return toast("Notifications aren't supported here.", "error"); const p = await Notification.requestPermission(); S.settings.notify = p === "granted"; if (p !== "granted") toast("Notifications weren't allowed.", "error"); else checkReminders(); } else S.settings.notify = false; save(); rerender(); },
  remDay: a => { const d = +a.dataset.d, set = new Set(S.settings.remindDays); a.checked ? set.add(d) : set.delete(d); S.settings.remindDays = [...set].sort((x, y) => y - x); save(); rerender(); },
  remSrc: a => { const set = new Set(S.settings.remindSources); a.checked ? set.add(a.dataset.k) : set.delete(a.dataset.k); S.settings.remindSources = [...set]; save(); rerender(); },
  msDone: a => { S.research.milestones.find(m => m.id === a.dataset.id).done = a.checked; save(); rerender(); },
  msField: a => { S.research.milestones.find(m => m.id === a.dataset.id)[a.dataset.k] = a.value; save(); },
  rlField: a => { const e = S.research.entries.find(x => x.id === a.dataset.id); e[a.dataset.k] = a.value; e.updated = Date.now(); save(); if (a.tagName === "SELECT") rerender(); }
};
function curResume() { const sel = S.resumes.find(r => r.id === S.ui.resumeSel) || S.resumes.find(r => r.current) || S.resumes[0]; return sel.current.parsed; }
function resumeEdited() { const sel = S.resumes.find(r => r.id === S.ui.resumeSel) || S.resumes.find(r => r.current); if (sel?.current) sel.current.edited = Date.now(); save(); }
const INPUT = {
  rEdit: a => { const p = curResume(), path = a.dataset.path.split("."), v = a.value;
    if (path[0] === "name") p.name = v; else if (path[0] === "contacts") p.contacts = v.split(/\s*[•|]\s*/).filter(Boolean);
    else if (path[0] === "skills") p.skills = v.split(",").map(x => x.trim()).filter(Boolean);
    else if (path.length === 3) p.sections[+path[1]].title = v;
    else { const e = p.sections[+path[1]].entries[+path[2]]; if (path[3] === "bullets") e.bullets = v.split("\n").map(x => x.trim()).filter(Boolean); else e[path[3]] = v; }
    clearTimeout(INPUT._r); INPUT._r = setTimeout(resumeEdited, 400); },
  agendaQ: a => { S.ui.agendaQ = a.value; clearTimeout(INPUT._t); INPUT._t = setTimeout(() => { save(); rerender(); const i = $('[data-act="agendaQ"]'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 250); }
};
document.addEventListener("click", e => { const a = e.target.closest("[data-act]"); if (!a) return; const fn = CLICK[a.dataset.act]; if (fn && !(a.tagName === "INPUT" || a.tagName === "SELECT" || a.tagName === "TEXTAREA")) fn(a, e); });
document.addEventListener("change", e => { const a = e.target.closest("[data-act]"); if (a && CHANGE[a.dataset.act]) CHANGE[a.dataset.act](a, e); });
document.addEventListener("input", e => { const a = e.target.closest("[data-act]"); if (a && INPUT[a.dataset.act]) INPUT[a.dataset.act](a, e); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLayer(); if (e.key === "Enter" && e.target.matches("input.cell, input.name")) e.target.blur(); });

/* ---------------- boot ---------------- */
let deferredInstall = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; if (route().sub === "reminders") rerender(); });
S = (() => { const saved = LS.get(STORE_KEY, null); return saved ? migrate(saved) : seedState(); })();
LS.set(STORE_KEY, S);
Cloud.restore();
applyTheme();
if (!location.hash) location.replace("#/home");
render();
if (icsUrl() && S.settings.autoSync && (!S.ics.lastSync || Date.now() - S.ics.lastSync > 15 * 60 * 1000)) syncNow(true);
if (Cloud.signedIn) Cloud.afterSignIn();
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
checkReminders(); setInterval(checkReminders, 15 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState !== "visible") return; checkReminders();
  if (Cloud.signedIn && S.settings.cloudSync) Cloud.pull().then(rerender).catch(() => {}); });
window.FOCUS = {parseICS, expandRule, parseResumeLines, pdfLines, totals, extractSyllabus, planWarnings, Cloud, migrate, get state() { return S; }};
</script>
</body>
</html>
